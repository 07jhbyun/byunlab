name: Update publications

on:
  schedule:
    - cron: "0 0 * * 1"   # every Monday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch publications from OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python scripts/fetch_pubs.py

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Record the check date at most once per calendar month to keep the schedule alive.
      - name: Update monthly keepalive stamp
        run: |
          today="$(date -u +%Y-%m-%d)"
          stamp=data/last_checked.txt
          if [ ! -f "$stamp" ] || [ "$(cut -c1-7 "$stamp")" != "${today:0:7}" ]; then
            echo "$today" > "$stamp"
            echo "Keepalive stamp updated: $today"
          else
            echo "Keepalive stamp already set this month: $(cat "$stamp")"
          fi

      - name: Commit and push if changed
        run: |
          today="$(date -u +%Y-%m-%d)"
          if git diff --quiet -- data/publications.json; then
            pubs_changed=false
          else
            pubs_changed=true
          fi
          git add data/publications.json data/last_checked.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          if [ "$pubs_changed" = true ]; then
            message="chore: update publications ($today)"
          else
            message="chore: update last checked date ($today)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          # CMS edits may have landed on main while this job was running.
          git pull --rebase
          git push
